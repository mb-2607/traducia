<div class="fondo-404">

      <div class="orb orb--2"></div>

      <div class="orb orb--4"></div>

      <div class="error-container">
        <div class="error-code">404</div>
        <p class="error-msg">
          Ups, esto no es lo que estabas buscando, pero gracias, encontraste el zapato que me faltaba.
        </p>
        <a routerLink="/planes" class="home-btn">Volver al landing page</a>

      <div class="penguin-scene">
