<button
  type="button"
  class="boton-icono"
  [class.grabando]="escuchando"
  [attr.aria-pressed]="escuchando"
  [attr.aria-label]="titulo"
  [title]="titulo"
  [disabled]="deshabilitado || !voz || !disponible"
  (click)="alternar()"
>
  <i
    class="fa-solid"
    [class.fa-microphone]="!escuchando"
    [class.fa-stop]="escuchando"
    aria-hidden="true"
  ></i>
</button>
